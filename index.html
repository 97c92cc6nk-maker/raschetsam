        <p>Стоимость результата услуг за отчетный период составляет <strong>${escapeHtml(formatRub(context.summary.total))}</strong>, НДС не облагается.</p>
      `);
    }

    function buildActDocument(context) {
      const actContext = getActDocumentContext(context);
      const contractDate = getContractDate(context);
      return wrapDocumentHtml(`Акт ${documentNumber(context, "А")}`, `
        <h1>Акт оказанных услуг № ${escapeHtml(documentNumber(context, "А"))}</h1>
        <p>г. Москва <span class="right">${escapeHtml(formatDate(actContext.actPeriodEnd))}</span></p>
        <p>${partyCompany(context.company)} и ${partyEmployee(context.employee)} составили настоящий акт о том, что Исполнитель оказал услуги по ${escapeHtml(actContext.actTaskLabel)} к договору № ${escapeHtml(contractNumber(context))} от ${escapeHtml(formatDate(contractDate))} за период ${escapeHtml(actContext.actPeriodLabel)}.</p>
        <h2>1. Результат оказанных услуг</h2>
        <p>Услуги оказаны в полном объеме, в установленные сроки и с надлежащим качеством. Исполнителем обеспечено:</p>
        <ul>
          <li>надлежащее функционирование пункта выдачи заказов (ПВЗ) в пределах результата, согласованного сторонами в ТЗ;</li>

        <h2>5. Реквизиты и подписи</h2>
        ${requisitesTable(context)}
      `);

    function getActDocumentContext(context) {
      if (!usesMonthlyActPeriod(context.weekStart)) {
        return {
          ...context,
          actPeriodStart: context.weekStart,
          actPeriodEnd: context.weekEnd,
          actPeriodLabel: getWeekLabel(context.weekStart),
          actTaskLabel: "техническому заданию"
        };
      }
      const monthId = getMonthId(context.weekStart);
      const serviceRows = validRowsForMath(state.shifts)
        .filter((row) => row.employee === context.summary.employee && row.company === context.summary.company && getMonthId(row.date) === monthId)
        .sort((a, b) => a.date.localeCompare(b.date));
      const summary = serviceRows.reduce((result, row) => {
        result.shifts += 1;
        result.hours += Number(row.hours || 0);
        result.total += getDayAmount(row);
        return result;
      }, { ...context.summary, shifts: 0, hours: 0, total: 0 });
      const actPeriodStart = monthId === getMonthId(NEW_NUMBERING_START_DATE) ? NEW_NUMBERING_START_DATE : getMonthStart(monthId);
      const actPeriodEnd = getMonthEnd(monthId) > END_DATE ? END_DATE : getMonthEnd(monthId);
      return {
        ...context,
        summary,
        serviceRows,
        actPeriodStart,
        actPeriodEnd,
        actPeriodLabel: `${formatDate(actPeriodStart)} - ${formatDate(actPeriodEnd)}`,
        actTaskLabel: "техническим заданиям"
      };
    }

    function documentNumber(context, prefix) {
      if (prefix === "Д") return contractNumber(context);
      const docType = { "Д": "contract", "ТЗ": "task", "А": "act" }[prefix] || "document";
      return getShortDocumentNumber(context, docType);

    function contractNumber(context) {
      return getContractDetails(context).number;
    }

    function getContractDate(context) {
      return getContractDetails(context).date;
    }

    function getContractDetails(context) {
      const employee = context?.summary?.employee || context?.employee?.shortName || "";
      const company = context?.summary?.company || context?.company?.alias || "";
      return getEmployeeCompanyContract(employee, company);
    }

    function getEmployeeCompanyContract(employee, company) {
      const fallback = getDefaultContractDetails(employee, company, state?.shifts || []);
      const saved = state?.requisites?.employees?.[employee]?.contracts?.[company];
      return {
        number: String(saved?.number || fallback.number || "").trim(),
        date: normalizeContractDate(saved?.date, fallback.date)
      };
    }

    function getShortDocumentNumber(context, docType) {
      const key = getDocumentKey(context, docType);
      const company = context.summary?.company || context.company?.alias || "";
      const sequenceDate = getDocumentSequenceDate(context, docType);
      const allKeys = getDocumentKeys(docType, company, sequenceDate);
      const index = allKeys.indexOf(key);
      const sequence = index >= 0 ? index + 1 : shortHashNumber(key);
      return formatShortDocumentNumber(docType, company, sequence, sequenceDate);
    }

    function formatShortDocumentNumber(docType, company, sequence, documentDate = "") {
      if (usesCompanyDocumentNumbering(docType, company, documentDate)) {
        return formatCompanyDocumentNumber(docType, company, sequence, documentDate);
      }
      const prefix = { contract: "D", task: "T", act: "A" }[docType] || "X";
      const series = COMPANY_DOCUMENT_SERIES[company] || "00";
      return prefix + series + Number(sequence || 0).toString(36).toUpperCase().padStart(3, "0").slice(-3);
    }

    function getDocumentKeys(docType, company, sequenceDate = "") {
      const keys = new Set();
      const useNewNumbering = usesCompanyDocumentNumbering(docType, company, sequenceDate);
      getWeekSummaryRows(false)
        .filter((row) => !company || row.company === company)
        .forEach((row) => {
          const rowDate = getDocumentSequenceDateFromParts(docType, row.weekStart, row.employee, row.company);
          if (!isSameDocumentNumberingSequence(docType, row.company, rowDate, useNewNumbering, sequenceDate)) return;
          keys.add(getDocumentKeyFromParts(docType, row.weekStart, row.employee, row.company));
        });
      return [...keys].sort();
    }

    function getDocumentKey(context, docType) {
      return getDocumentKeyFromParts(docType, context.weekStart, context.summary.employee, context.summary.company);
    }

    function getDocumentKeyFromParts(docType, weekStart, employee, company) {
      const period = docType === "contract" ? CONTRACT_YEAR : (docType === "act" && usesMonthlyActPeriod(weekStart) ? getMonthId(weekStart) : weekStart);
      return [docType, period, employee, company].join("|");
    }

    function getDocumentSequenceDate(context, docType) {
      if (docType === "contract") return getContractDate(context);
      return context.weekStart;
    }

    function getDocumentSequenceDateFromParts(docType, weekStart, employee, company) {
      if (docType === "contract") return getFirstEmployeeCompanyShiftDate(employee, company) || START_DATE;
      return weekStart;
    }

    function isSameDocumentNumberingSequence(docType, company, rowDate, useNewNumbering, sequenceDate) {
      if (usesCompanyDocumentNumbering(docType, company, rowDate) !== useNewNumbering) return false;
      const rule = COMPANY_DOCUMENT_NUMBERING[company]?.[docType];
      if (useNewNumbering && rule?.includeMonth) {
        return getMonthId(rowDate) === getMonthId(sequenceDate);
      }
      return true;
    }

    function usesCompanyDocumentNumbering(docType, company, documentDate) {
      return Boolean(COMPANY_DOCUMENT_NUMBERING[company]?.[docType] && documentDate >= NEW_NUMBERING_START_DATE);
    }

    function usesMonthlyActPeriod(weekStart) {
      return weekStart >= NEW_NUMBERING_START_DATE;
    }

    function formatCompanyDocumentNumber(docType, company, sequence, documentDate) {
      const rule = COMPANY_DOCUMENT_NUMBERING[company]?.[docType];
      if (!rule) return String(sequence || "");
      const number = String(Number(sequence || 0));
      const month = rule.includeMonth ? getMonthNumber(documentDate) : "";
      return `${rule.prefix || ""}${month}${number}`;
    }

    function shortHashNumber(value) {
      let hash = 2166136261;
      String(value).split("").forEach((char) => {
        hash ^= char.charCodeAt(0);
        hash = Math.imul(hash, 16777619);
      });
      return (hash >>> 0) % 1679615 + 1;
    }

    function docFilePrefix(docType) {
      return { contract: "Договор", task: "ТЗ", act: "Акт", package: "Пакет" }[docType] || "Документ";
    }

    function safeFileName(value) {
      return String(value || "").replace(/[\\/:*?"<>|]+/g, "_").replace(/\s+/g, "_");
    }

    function blank(value) {
      return value || "ЗАПОЛНИТЬ";
    }

    function downloadDoc(fileName, html) {
      const blob = new Blob(["\ufeff" + html], { type: "application/msword;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function openPdfPrintWindow(fileName, html) {
      const printWindow = window.open("", "_blank");
      if (!printWindow) {
        addLog("Не удалось открыть окно PDF: браузер заблокировал новое окно", "error");
        showToast("Разрешите всплывающее окно для PDF");
        return false;
      }
      try {
        printWindow.document.open();
        printWindow.document.write(html);
        printWindow.document.close();
        printWindow.document.title = fileName.replace(/\.pdf$/i, "");
        const printDocument = () => {
          printWindow.focus();
          printWindow.print();
        };
        if (printWindow.document.readyState === "complete") {
          setTimeout(printDocument, 200);
        } else {
          printWindow.addEventListener("load", () => setTimeout(printDocument, 200), { once: true });
        }
        return true;
      } catch (error) {
        addLog("Не удалось подготовить PDF: " + error.message, "error");
        showToast("PDF не сформирован");
        return false;
      }
    }

    function getCsvRows() {
      const activeMonth = MONTHS.find((month) => month.id === ui.activeTab);
      if (activeMonth) {
        return [
          ["ФИО", "Дата", "День недели", "Компания", "Часы", "Ставка", "Сумма за день", "Неделя", "Сумма за неделю по компании", "Статус оплаты"],
          ...getVisibleRows(activeMonth.id).map((row) => {
            const weekStart = getWeekStart(row.date);
            const paymentKey = getPaymentKey(weekStart, row.employee, row.company);
            return [
              row.employee,
              formatDate(row.date),
              getDayName(row.date),
              row.company,
              row.hours,
              row.rate,
              getDayAmount(row),
              getWeekLabel(weekStart),
              getEmployeeCompanyWeekSum(row.employee, row.company, weekStart),
              PAYMENT_STATUSES[getPaymentStatus(paymentKey, weekStart)].label
            ];
          })
        ];
      }
      if (ui.activeTab === "summary") {
        return [
          ["Неделя", "Статус недели", "ФИО", "Компания", "Смены", "Часы", "Итого", "Статус оплаты"],
          ...getSortedWeekSummaryRows().map((row) => {
            const paymentKey = getPaymentKey(row.weekStart, row.employee, row.company);
            return [
              getWeekLabel(row.weekStart),
              isFullWeek(row.weekStart) ? "полная" : "неполная",
              row.employee,
              row.company,
              row.shifts,
              row.hours,
              row.total,
              PAYMENT_STATUSES[getPaymentStatus(paymentKey, row.weekStart)].label
            ];
          })
        ];
      }
      if (ui.activeTab === "checks") {
        const checks = validateSchedule();
        return [
          ["Тип", "Строка", "Описание"],
          ...checks.errors.map((item) => ["Ошибка", item.rowId, item.message]),
          ...checks.warnings.map((item) => ["Предупреждение", item.rowId, item.message])
        ];
      }
      return [
        ["Время", "Уровень", "Сообщение"],
        ...state.logs.map((item) => [item.time, levelLabel(item.level), item.message])
      ];
    }

    function fieldLabel(field) {
      return {
        employee: "ФИО",
        date: "дата",
        company: "компания",
        hours: "часы",
        rate: "ставка"
      }[field] || field;
    }

    function sortShifts(shifts) {
      return [...shifts].sort((a, b) => a.date.localeCompare(b.date) || EMPLOYEES.indexOf(a.employee) - EMPLOYEES.indexOf(b.employee) || a.company.localeCompare(b.company));
    }

    function parseIso(iso) {
      const [year, month, day] = iso.split("-").map(Number);
      return new Date(Date.UTC(year, month - 1, day));
    }

    function toIso(date) {
      return date.toISOString().slice(0, 10);
    }

    function addDays(date, days) {
      return new Date(date.getTime() + days * 86400000);
    }

    function isValidIsoDate(value) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(value))) return false;
      return toIso(parseIso(value)) === value;
    }

    function getWeekStart(iso) {
      if (!isValidIsoDate(iso)) return "";
      const date = parseIso(iso);
      const day = date.getUTCDay();
      const offset = day === 0 ? -6 : 1 - day;
      return toIso(addDays(date, offset));
    }

    function getMonthId(iso) {
      return isValidIsoDate(iso) ? iso.slice(0, 7) : "";
    }

    function getMonthNumber(iso) {
      return getMonthId(iso).slice(5, 7);
    }

    function getMonthStart(monthId) {
      return /^\d{4}-\d{2}$/.test(String(monthId)) ? monthId + "-01" : "";
    }

    function getMonthEnd(monthId) {
      if (!/^\d{4}-\d{2}$/.test(String(monthId))) return "";
      const [year, month] = monthId.split("-").map(Number);
      return toIso(new Date(Date.UTC(year, month, 0)));
    }

    function isFullWeek(weekStart) {
      if (!isValidIsoDate(weekStart)) return false;
      const weekEnd = toIso(addDays(parseIso(weekStart), 6));
      return weekStart >= START_DATE && weekEnd <= END_DATE && !PARTIAL_WEEK_STARTS.has(weekStart);
    }

    function isEmployeeActiveFullWeek(employee, weekStart) {
      return isFullWeek(weekStart) && EMPLOYEE_START_DATES[employee] <= weekStart;
    }

    function getWeekLabel(weekStart) {
      if (!isValidIsoDate(weekStart)) return "нет недели";
      return `${formatDate(weekStart)} - ${formatDate(toIso(addDays(parseIso(weekStart), 6)))}`;
    }

    function formatShortWeek(weekStart) {
      if (!isValidIsoDate(weekStart)) return "";
      return `${formatDate(weekStart).slice(0, 5)}-${formatDate(toIso(addDays(parseIso(weekStart), 6))).slice(0, 5)}`;
    }

    function getDayName(iso) {
      if (!isValidIsoDate(iso)) return "";
      const value = dayFormat.format(parseIso(iso));
      return value.charAt(0).toUpperCase() + value.slice(1);
    }

    function formatDate(iso) {
      if (!isValidIsoDate(iso)) return iso || "";
      return dateFormat.format(parseIso(iso));
    }

    function formatRub(value) {
      return currency.format(Number(value || 0));
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeCsv(value) {
      const text = String(value ?? "");
      if (/[;"\n\r]/.test(text)) return `"${text.replaceAll('"', '""')}"`;
      return text;
    }

    function levelClass(level) {
      return { info: "info", warning: "warn", error: "error" }[level] || "info";
    }

    function levelLabel(level) {
      return { info: "Инфо", warning: "Важно", error: "Ошибка" }[level] || "Инфо";
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2200);
    }
  </script>
</body>
